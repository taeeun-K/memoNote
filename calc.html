<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>
  <link rel="stylesheet" href="./css/style.css">
  <title>♥가계부♥</title>
</head>
<body>
  <div id="wrap">
    <header>
      <h1 class="logo_calc"><a href="#">❤︎ 가계부 ❤︎</a></h1>
      <button type="button" class="resetBtn">전체삭제</button>
    </header>
<style>

  header h1.logo_calc   {text-align: center;}
  header h1.logo_calc a   {color: #26ff43; font-size: 28px; font-family: 'Dandan'; text-decoration: none; }
  #result {
    margin-top: 20px;
  }
  #result h2 {
    font-family: 'YoonChildfundkoreaDaeHan';
    color: rgb(114, 114, 114);
  }

  #recordList li span { height: 100%; font-size: 14px; font-family: 'SchoolSafetyStubbyChalk'; border-right: 1px dashed #ccc;}
  #recordList li span.date {flex-grow: 0; width: 100px;}
  #recordList li span.text {flex: 1; font-size: 16px;}
  #recordList li span.price {flex-grow: 0; width: 100px; border-right: none;}
  button.deleteBtn    { width: 20px; height: 20px; line-height: 20px; font-size: 14px; border-radius: 50%; font-weight: 700; background-color: #ff5b91; font-family: 'YoonChildfundkoreaDaeHan';}

</style>
<section>
  <!-- 용돈 기록장을 쿠키에 넣어서 관리하는 화면  -->
   <!-- <ul id="tabMenu">
    <li><button type="button" class="btnCalc">용돈입력</button></li>
    <li><button type="button" class="btnCal">용돈달력</button></li>
   </ul> -->
    <article id="calcArticle">
      <form name="calcForm" id="calcForm">
        <fieldset>
          <legend>용돈기입</legend>
          <label for="date">날짜</label>
          <input type="date" id="date" name="date" required>
          <label for="content">내용</label>
          <input type="text" id="content" name="content" required>
          <label for="amount">금액</label>
          <input type="number" id="amount" name="amount" required>
          <button type="submit">기록하기</button>
        </fieldset>
      </form>
      <div id="result">
        <h2>지출내역</h2>
        <ul id="recordList">
          <!-- 기록된 용돈 내역이 여기에 표시됩니다. -->
        </ul>
    </article>
<script>
//  tabMenu 스트립트
$(document).ready(function() {
    $('#tabMenu button').click(function() {
        const index = $(this).parent().index();
        $('#tabMenu li').removeClass('active');
        $(this).parent().addClass('active');
        if (index === 0) {
            $('#calcArticle').show();
            $('#calendarArticle').hide();
        } else {
            $('#calcArticle').hide();
            $('#calendarArticle').show();
            // 달력 초기화 및 쿠키에 저장된 데이터 불러서 달력에 노출
            
            $('#calendar').datepicker({
                dateFormat: 'yy-mm-dd',
                onSelect: function(dateText) {
                    alert('선택한 날짜: ' + dateText);
                }
            });
        }
    });
    // 초기 상태 설정
    $('#tabMenu li:first-child').addClass('active');
    $('#calcArticle').show();
    $('#calendarArticle').hide();
});

//


// 용돈 기록을 로컬 스토리지에 저장하고 불러오는 기능 구현
$(document).ready(function() {
    // 기록된 용돈 내역을 로컬 스토리지에서 불러와서 표시
    function loadRecords() {
        const records = JSON.parse(localStorage.getItem('allowanceRecords')) || [];
        const recordList = $('#recordList');
        recordList.empty();
        // 날짜순으로 정렬
        records.sort((a, b) => new Date(b.date) - new Date(a.date));
        records.forEach((record, index) => {    
            recordList.append(`
                <li>
                    <span class="date">${record.date}</span>
                    <span class="text">${record.content}</span>
                    <span class="price">${record.amount.toLocaleString()}원</span>
                    <button type="button" class="deleteBtn" data-index="${index}">X</button>
                </li>
            `);
        });
    }

    // 용돈 기록 폼 제출 시 로컬 스토리지에 저장 오늘 날짜 자동 입력
    $('#calcForm').on('submit', function(event) {
        event.preventDefault();
        const date = $('#date').val();
        const content = $('#content').val();
        const amount = $('#amount').val();
        if (!date || !content || !amount) {
            alert('모든 필드를 입력해주세요.');
            return;
        }
        const newRecord = { date, content, amount: parseInt(amount) };
        const records = JSON.parse(localStorage.getItem('allowanceRecords')) || [];
        records.push(newRecord);
        // localStorage.setItem('allowanceRecords', JSON.stringify(records));

        // 아래주석2줄 date 기준 스토리지 정렬이 안되서 추가
        // 기록을 날짜순으로 정렬
        records.sort((a, b) => new Date(b.date) - new Date(a.date)); // 내림차순 정렬 (최신 날짜가 위에)
        // 정렬된 기록을 로컬 스토리지에 저장
        localStorage.setItem('allowanceRecords', JSON.stringify(records));

        loadRecords();
        this.reset();
    });
    

    // 삭제 버튼 클릭 시 해당 기록 삭제
    $('#recordList').on('click', '.deleteBtn', function() {
        const index = $(this).data('index');
        const records = JSON.parse(localStorage.getItem('allowanceRecords')) || [];
        records.splice(index, 1);
        localStorage.setItem('allowanceRecords', JSON.stringify(records));
        loadRecords();
    });


    // 전체 삭제 버튼 클릭 시 모든 기록 삭제
    $('.resetBtn').on('click', function() {
        if (confirm('정말로 모든 기록을 삭제하시겠습니까?')) {
            localStorage.removeItem('allowanceRecords');
            loadRecords();
        }
    });

    // 초기 로드 시 기록 불러오기
    loadRecords();
})
</script>
    

   
    
</section>
</div>

<style>
