<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>password 입력</title>
  <style>
    *{margin: 0; padding: 0; box-sizing: border-box;}
    body {display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: Arial, sans-serif; background-color: #f4f4f4; }

    h1 {text-align: center; margin-bottom: 20px; color: #333;}
    form {max-width: 400px; margin: 0 auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);}

    label {display: block; margin-bottom: 10px; font-weight: bold; color: #555;}
    input[type="password"] {width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;}
    button {width: 100%; padding: 10px; background-color: #4ca7fd; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;}
    p#msg {margin-top: 10px; font-size: 12px; font-weight: bold;}
    span#hint {display: block; color: #777777; font-size: 10px; text-align: right;}
  </style>
</head>
<body>
  <h1>password</h1>
  <form id="pwForm">
    <label for="userPassword">비밀번호 입력:</label>
    <input type="password" id="userPassword" name="userPassword" placeholder="비밀번호를 입력하세요">
    <button type="submit">확인</button>
    <p id="msg" style="color: red; margin-top: 10px;"></p>
  </form>

<script>
  //사용하지않기때문에 user_set파일로 리다이렉트
  location.href = "./user_set.html";
    
    // 메모노트 파일에 location.href="./password/index.html" 적용해야함

    // 18e87bc99ee1d95be135acda0fdcc58526ac04c7a09292a4534d636b52232f67
    // console.log
    // async function sha256(message) {
    //   const msgBuffer = new TextEncoder().encode(message);
    //   const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
    //   const hashArray = Array.from(new Uint8Array(hashBuffer));
    //   return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
    // }

    // sha256("비밀번호").then(console.log);
  
  // SHA-256 해시 생성 함수
  async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
  }

  const PASSWORD_HASH = "bbb3cb7e622c12f9399c023789d8662c2668faa0d51fc916ff9a2f94d561356c";

  document.getElementById("pwForm").addEventListener("submit", async function(e) {
    e.preventDefault(); // form 기본 전송 막기

    const pw = document.getElementById("userPassword").value;
    const inputHash = await sha256(pw);

    if (inputHash === PASSWORD_HASH) {
      sessionStorage.setItem("memoAccess1", "ok");
      //페이지 열때마다 체크 -> sessionStorage.setItem("memoAccess1")
      //최초 1회 체크 -> sessionStorage.setItem("memoAccess1")
      //메모장페이지에서는 getItem으로 체크해서 접근 허용
      
      alert("비밀번호일치. 사이트로 이동합니다!");
      location.href = "https://taeeun-k.github.io/memoNote/";
    } else {
      const msgElement = document.getElementById("msg");
      msgElement.textContent = "비밀번호가 틀렸습니다!";
      
      // 힌트 span 요소가 없으면 추가
      if (!document.getElementById("hint")) {
        const hintSpan = document.createElement("span");
        hintSpan.id = "hint";
        hintSpan.textContent = " 힌트: 결혼식00";
        msgElement.appendChild(hintSpan);
      }
    }
  });
</script>
